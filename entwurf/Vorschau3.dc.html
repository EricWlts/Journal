<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Lang druecken aus einem Guss</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Manrope:wght@400;500;600&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&amp;display=swap">
<style>
body{margin:0}
::selection{background:rgba(163,95,58,.22)}
.card{position:absolute;left:12px;width:366px;height:104px;border:0;border-radius:12px;background:#e4e2db;text-align:left;padding:16px 18px 0 22px;display:grid;grid-template-columns:58px 1fr;font-family:inherit;color:#26302b;cursor:pointer;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .45s cubic-bezier(.32,.72,0,1),opacity .3s}
.card.press{transform:scale(.965);transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.card.hid{opacity:0;transition:none}
.card.back{transition:none}
.dim{position:absolute;inset:0;background:rgba(14,17,13,.28);-webkit-backdrop-filter:blur(14px) saturate(.9);backdrop-filter:blur(14px) saturate(.9);transition:opacity .55s cubic-bezier(.32,.72,0,1)}
.dim.off{opacity:0;pointer-events:none}
.pv{position:absolute;border-radius:14px;background:#f7f5ef;overflow:hidden;box-shadow:0 30px 70px rgba(10,12,9,.35),0 0 0 1px rgba(38,48,43,.08);transition:top .55s cubic-bezier(.32,.72,0,1),left .55s cubic-bezier(.32,.72,0,1),width .55s cubic-bezier(.32,.72,0,1),height .55s cubic-bezier(.32,.72,0,1),border-radius .55s,background-color .55s,box-shadow .55s}
.pv.small{box-shadow:0 0 0 rgba(0,0,0,0);background:#e4e2db;border-radius:12px}
.pv .inner{transition:opacity .3s .1s}.pv.small .inner{opacity:0;transition:opacity .16s}
.rep{position:absolute;left:0;top:0;width:366px;height:104px;box-sizing:border-box;padding:16px 18px 0 22px;display:grid;grid-template-columns:58px 1fr;opacity:0;transition:opacity .18s}
.pv.pre .rep{opacity:1;transition:none}
.pv.closing .rep{opacity:1;transition:opacity .28s .22s}
.menu{position:absolute;left:96px;width:282px;border-radius:14px;background:rgba(247,245,239,.94);overflow:hidden;box-shadow:0 20px 50px rgba(10,12,9,.25);transform-origin:80% 0;transition:opacity .35s,transform .5s cubic-bezier(.32,.72,0,1)}
.menu.off{opacity:0;transform:scale(.9) translateY(-6px);pointer-events:none;transition:opacity .18s,transform .3s cubic-bezier(.4,0,1,1)}
.mi{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:transparent;padding:14px 18px;font-family:Manrope,sans-serif;font-size:15px;color:#26302b;cursor:pointer;transition:background-color .2s}
.mi:active{background:rgba(38,48,43,.06)}
.mi+.mi{border-top:1px solid rgba(38,48,43,.08)}
.hint{transition:opacity .5s}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#12150f;font-family:Manrope,system-ui,sans-serif;color:#26302b">
  <div style="position:absolute;top:70px;left:24px;font-family:'Instrument Serif',serif;color:#f2f3ef;line-height:1;display:flex;align-items:baseline;gap:12px"><span style="font-size:60px;letter-spacing:-.015em">November</span><span style="font-size:38px;font-style:italic;color:#7f8b81">2026</span></div>
  <div style="position:absolute;top:236px;left:0;right:0;bottom:0;background:#eeece6;border-radius:16px 16px 0 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.55)"></div>
  <sc-for list="{{cards}}" as="c" hint-placeholder-count="5">
    <button class="card {{c.cls}}" onPointerDown="{{c.down}}" onPointerUp="{{c.up}}" onPointerLeave="{{c.up}}" onContextMenu="{{noCtx}}" style="top:{{c.top}}px">
      <span style="display:flex;flex-direction:column"><span style="font-family:'Instrument Serif',serif;font-size:34px;line-height:1;font-variant-numeric:tabular-nums">{{c.d}}</span><span style="font-size:9.5px;letter-spacing:.18em;color:#506055;font-weight:600;margin-top:6px">{{c.wd}}</span></span>
      <span style="min-width:0"><span style="display:block;font-family:'Instrument Serif',serif;font-size:22px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{c.title}}</span><span style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;line-height:1.5;color:#59625c;margin-top:6px">{{c.ex}}</span></span>
    </button>
  </sc-for>
  <div class="hint" style="position:absolute;left:0;right:0;bottom:28px;text-align:center;font-size:12px;color:#7d897f;opacity:{{hintO}}">Eine Karte gedrückt halten</div>
  <div class="dim {{dimCls}}" onClick="{{close}}"></div>
  <sc-if value="{{showPv}}" hint-placeholder-val="{{ false }}">
    <div class="pv {{pvCls}}" style="top:{{pv.top}}px;left:{{pv.left}}px;width:{{pv.w}}px;height:{{pv.h}}px">
      <div class="rep">
        <span style="display:flex;flex-direction:column"><span style="font-family:'Instrument Serif',serif;font-size:34px;line-height:1;font-variant-numeric:tabular-nums">{{cur.d}}</span><span style="font-size:9.5px;letter-spacing:.18em;color:#506055;font-weight:600;margin-top:6px">{{cur.wd}}</span></span>
        <span style="min-width:0"><span style="display:block;font-family:'Instrument Serif',serif;font-size:22px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{cur.title}}</span><span style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;line-height:1.5;color:#59625c;margin-top:6px">{{cur.ex}}</span></span>
      </div>
      <div class="inner" style="padding:22px 22px 0">
        <div style="display:flex;align-items:flex-end;gap:12px"><span style="font-family:'Instrument Serif',serif;font-size:40px;line-height:.85">{{cur.d}}</span><span style="line-height:1.35"><span style="display:block;font-size:10.5px;letter-spacing:.18em;color:#506055;font-weight:600">{{cur.wdl}}</span><span style="display:block;font-family:Newsreader,serif;font-style:italic;font-size:14px;color:#6f7a71">November 2026 · Leer · 4° Nebel · Sonne 8:19 – 16:18</span></span></div>
        <div style="font-family:'Instrument Serif',serif;font-size:32px;line-height:1.1;letter-spacing:-.015em;margin-top:18px">{{cur.title}}</div>
        <div style="font-family:Newsreader,serif;font-size:17px;line-height:1.6;color:#2b2722;margin-top:10px;-webkit-user-select:text;user-select:text">{{cur.body}}</div>
      </div>
    </div>
  </sc-if>
  <div class="menu {{menuCls}}" style="top:{{menuTop}}px">
    <button class="mi" onClick="{{close}}">Öffnen<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"></path></svg></button>
    <button class="mi" onClick="{{close}}">Als Markdown teilen<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M5 13v6h14v-6"></path></svg></button>
    <button class="mi" onClick="{{close}}" style="color:#9b4434">Löschen …<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12h10l1-12M9 7V4h6v3"></path></svg></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { press: -1, open: -1, phase: 'closed', tried: false }; }
  data(){ const b = 'Heute war einer dieser Tage, an denen alles etwas langsamer läuft. Ich habe lange am Fenster gesessen, Kaffee getrunken und zugesehen, wie der Nebel über den Wiesen liegt. Später noch ein Stück am Deich gelaufen.';
    return [
      { d: '26', wd: 'DO', wdl: 'DONNERSTAG', title: 'Lange geschlafen', ex: 'Heute war einer dieser Tage, an denen alles etwas langsamer läuft.', body: b },
      { d: '25', wd: 'MI', wdl: 'MITTWOCH', title: 'Morgens am Hafen', ex: 'Die Boote lagen still, nur die Möwen waren schon wach.', body: b },
      { d: '22', wd: 'SO', wdl: 'SONNTAG', title: 'Kurs: n8n-Workflows', ex: 'Endlich verstanden, wie die Knoten zusammenspielen.', body: b },
      { d: '21', wd: 'SA', wdl: 'SAMSTAG', title: 'Erste Kälte', ex: 'Raureif auf den Autos. Tee statt Kaffee.', body: b },
      { d: '20', wd: 'FR', wdl: 'FREITAG', title: 'Kleiner Durchbruch', ex: 'Beim Training eine neue Bestmarke.', body: b } ]; }
  top(i){ return 248 + i * 110; }
  down(i){ if (this.state.phase !== 'closed') return; this.setState({ press: i }); clearTimeout(this._lp); this._lp = setTimeout(() => this.peek(i), 480); }
  up(){ clearTimeout(this._lp); if (this.state.phase === 'closed') this.setState({ press: -1 }); }
  peek(i){ this.setState({ open: i, phase: 'pre', press: -1, tried: true }, () => requestAnimationFrame(() => requestAnimationFrame(() => this.setState({ phase: 'open' })))); }
  close(){ if (this.state.phase !== 'open') return; this.setState({ phase: 'closing' }); const k = this.state.open; setTimeout(() => this.setState({ phase: 'closed', open: -1, back: k }), 580); setTimeout(() => this.setState({ back: -1 }), 700); }
  renderVals(){
    const st = this.state, D = this.data(), i = Math.max(0, st.open), small = st.phase === 'pre' || st.phase === 'closing';
    const pv = small ? { top: this.top(i), left: 12, w: 366, h: 104 } : { top: 150, left: 16, w: 358, h: 360 };
    return {
      cards: D.map((c, k) => ({ ...c, top: this.top(k), cls: st.open === k && st.phase !== 'closed' ? 'hid' : (st.press === k ? 'press' : (st.back === k ? 'back' : '')), down: () => this.down(k), up: () => this.up() })),
      showPv: st.phase !== 'closed', pvCls: (small ? 'small ' : '') + (st.phase === 'pre' ? 'pre' : st.phase === 'closing' ? 'closing' : ''), pv, cur: D[i],
      dimCls: st.phase === 'open' ? '' : 'off', menuCls: st.phase === 'open' ? '' : 'off', menuTop: 522,
      hintO: st.tried ? 0 : 1, close: () => this.close(), noCtx: (e) => e.preventDefault()
    };
  }
}
</script>
</body>
</html>
